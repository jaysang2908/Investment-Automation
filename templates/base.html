<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Investment Utopia{% endblock %}</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Design system -->
  <link rel="stylesheet" href="/iu-redesign.css">

  <!-- Theme init: read saved preference before paint to avoid flash -->
  <script>
    (function() {
      try {
        var t = localStorage.getItem('iu-theme');
        if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch(e) {}
    })();
  </script>

  {% block head %}{% endblock %}
</head>
<body>

{% include 'partials/_nav.html' %}

{% block content %}{% endblock %}

{% include 'partials/_footer.html' %}

<!-- Site-wide JS -->
<script src="/js/app.js"></script>
{% block scripts %}{% endblock %}

</body>
</html>
