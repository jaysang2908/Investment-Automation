services:
  - type: web
    name: investment-automation
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --timeout 180 --workers 1
    envVars:
      - key: FMP_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: GEMINI_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false

  - type: cron
    name: daily-news-refresh
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "0 6 * * *"
    startCommand: python daily_news.py
    envVars:
      - key: FMP_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false

  - type: cron
    name: daily-price-refresh
    runtime: python
    buildCommand: pip install -r requirements.txt
    # 21:30 UTC = after US market close (20:00/21:00 UTC depending on DST),
    # weekdays only. Pushes refreshed outputs.csv to GitHub, which triggers
    # the Render redeploy that delivers it to the web container.
    schedule: "30 21 * * 1-5"
    startCommand: python daily_prices.py
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false

  - type: cron
    name: daily-long-term-bets
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "0 2 * * *"
    startCommand: python daily_long_term_bets.py
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: RENDER_INTERNAL_URL
        value: https://investment-automation.onrender.com
