<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heatmap — Equity.Research</title>
  <script>
    (function(){try{var t=localStorage.getItem('eq.theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}}());
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    /* ── TOOLBAR ── */
    .toolbar {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 24px; border-bottom: 1px solid var(--border);
      flex-wrap: wrap; background: var(--surface);
    }
    .toolbar-label {
      font-family: var(--font-mono); font-size: 7.5pt;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--ink-3); margin-right: 4px;
    }
    .metric-group, .size-group { display: flex; gap: 4px; align-items: center; }
    .sep { width: 1px; height: 24px; background: var(--border); margin: 0 8px; }

    .btn-metric {
      font-family: var(--font-mono); font-size: 8pt; letter-spacing: 0.5px;
      padding: 5px 12px; border-radius: var(--r-sm);
      border: 1px solid var(--border); background: transparent;
      color: var(--ink-3); cursor: pointer; transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-metric:hover { color: var(--ink); border-color: var(--accent); }
    .btn-metric.active {
      background: var(--h-n-bg); color: var(--accent);
      border-color: var(--accent);
    }

    /* ── CHART ── */
    #chartWrap { padding: 0; }
    #heatmap { width: 100%; height: calc(100vh - 140px); min-height: 520px; }

    /* ── LEGEND BAR ── */
    .legend-bar {
      display: flex; justify-content: center; align-items: center;
      gap: 8px; padding: 10px 24px; border-top: 1px solid var(--border);
      font-size: 8pt; color: var(--ink-3); font-family: var(--font-mono);
      background: var(--surface);
    }
    .legend-grad {
      width: 140px; height: 10px; border-radius: 4px;
      background: linear-gradient(to right, #ef4444, #eab308, #10b981);
    }

    /* ── LOADING ── */
    #loadingMsg {
      display: flex; align-items: center; justify-content: center;
      height: 400px; font-family: var(--font-mono); font-size: 9pt;
      color: var(--ink-3); letter-spacing: 2px;
    }
  </style>
</head>
<body>

<nav class="nav">
  <a href="/" class="brand">
    <span class="brand-mk">ER</span>
    <span>Equity.Research</span>
  </a>
  <ul class="nav-links">
    <li><a href="/">Long Term Bets</a></li>
    <li><a href="/muff" style="color:#c94a12">MUFF</a></li>
    <li><a href="/dashboard">Dashboard</a></li>
    <li><a href="/heatmap" class="active">Heatmap</a></li>
    <li><a href="/dcf">DCF</a></li>
    <li><a href="/news">News</a></li>
  </ul>
  <div class="nav-aside">
    <span class="live-badge">● Live</span>
    <span id="navTime" class="live-badge">--:-- UTC</span>
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">◐</button>
  </div>
</nav>

<div class="toolbar">
  <span class="toolbar-label">Metric</span>
  <div class="metric-group">
    <button class="btn-metric active" data-metric="score">Score</button>
    <button class="btn-metric" data-metric="gg_upside">GG Upside</button>
    <button class="btn-metric" data-metric="em_upside">EM Upside</button>
    <button class="btn-metric" data-metric="roic">ROIC</button>
    <button class="btn-metric" data-metric="rev_cagr">Rev CAGR</button>
    <button class="btn-metric" data-metric="pe">P/E</button>
    <button class="btn-metric" data-metric="pfcf">P/FCF</button>
    <button class="btn-metric" data-metric="d_ebitda">D/EBITDA</button>
    <button class="btn-metric" data-metric="fcf_ni">FCF/NI</button>
  </div>
  <div class="sep"></div>
  <span class="toolbar-label">Size</span>
  <div class="size-group">
    <button class="btn-metric active" data-size="mktcap_b" id="sizeMkt">Mkt Cap</button>
    <button class="btn-metric" data-size="revenue_b" id="sizeRev">Revenue</button>
  </div>
</div>

<div id="chartWrap">
  <div id="loadingMsg">LOADING…</div>
  <div id="heatmap" style="display:none"></div>
</div>

<div class="legend-bar">
  <span id="legendLow">Low</span>
  <div class="legend-grad"></div>
  <span id="legendHigh">High</span>
  <span style="margin-left:16px;color:var(--ink-3)">·  Size = </span>
  <span id="legendSize" style="color:var(--ink-2);margin-left:4px">Market Cap</span>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const METRICS = {
  score:      { label: 'Investment Score',     fmt: v => v.toFixed(1),       unit: '',    invert: false, mid: 5,    lo: 'Low Score',   hi: 'High Score'   },
  gg_upside:  { label: 'GG DCF Upside',        fmt: v => v.toFixed(1)+'%',   unit: '%',   invert: false, mid: 0,    lo: 'Overvalued',  hi: 'Undervalued'  },
  em_upside:  { label: 'Exit Multiple Upside', fmt: v => v.toFixed(1)+'%',   unit: '%',   invert: false, mid: 0,    lo: 'Overvalued',  hi: 'Undervalued'  },
  roic:       { label: 'ROIC',                 fmt: v => v.toFixed(1)+'%',   unit: '%',   invert: false, mid: 15,   lo: 'Low ROIC',    hi: 'High ROIC'    },
  rev_cagr:   { label: 'Revenue CAGR',         fmt: v => v.toFixed(1)+'%',   unit: '%',   invert: false, mid: 5,    lo: 'Low Growth',  hi: 'High Growth'  },
  pe:         { label: 'P/E (Current)',         fmt: v => v.toFixed(1)+'×',   unit: '×',   invert: true,  mid: 20,   lo: 'Cheap',       hi: 'Expensive'    },
  pfcf:       { label: 'P/FCF (Current)',       fmt: v => v.toFixed(1)+'×',   unit: '×',   invert: true,  mid: 20,   lo: 'Cheap',       hi: 'Expensive'    },
  d_ebitda:   { label: 'Debt / EBITDA',        fmt: v => v.toFixed(1)+'×',   unit: '×',   invert: true,  mid: 2,    lo: 'Low Debt',    hi: 'High Debt'    },
  fcf_ni:     { label: 'FCF / Net Income',     fmt: v => v.toFixed(2),       unit: '',    invert: false, mid: 1,    lo: 'Low Conv.',   hi: 'High Conv.'   },
};

let DATA      = [];
let curMetric = 'score';
let curSize   = 'mktcap_b';

function getBg() {
  return document.documentElement.getAttribute('data-theme') === 'dark' ? '#0d0f13' : '#ece7df';
}
function getTextColor() {
  return document.documentElement.getAttribute('data-theme') === 'dark' ? '#e8eaf0' : '#1a1814';
}
function getLineColor() {
  return document.documentElement.getAttribute('data-theme') === 'dark' ? '#0d0f13' : '#ece7df';
}

// ── Fetch data ────────────────────────────────────────────────────────────────
async function init() {
  const res  = await fetch('/api/heatmap-data');
  const json = await res.json();
  DATA = json.tickers || [];
  document.getElementById('loadingMsg').style.display = 'none';
  document.getElementById('heatmap').style.display = 'block';
  render();
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const cfg   = METRICS[curMetric];
  const rows  = DATA.filter(d => d[curMetric] !== null && d[curMetric] !== undefined);

  const loadingEl = document.getElementById('loadingMsg');
  const chartEl   = document.getElementById('heatmap');

  if (!rows.length) {
    chartEl.style.display = 'none';
    loadingEl.textContent = DATA.length ? `No data for metric: ${cfg.label}` : 'No coverage data loaded.';
    loadingEl.style.display = 'flex';
    return;
  }
  loadingEl.style.display = 'none';
  chartEl.style.display = 'block';

  // Collect unique sectors
  const sectors = [...new Set(rows.map(r => r.sector))].sort();

  // Build flat treemap arrays
  const labels   = [];
  const parents  = [];
  const values   = [];
  const colors   = [];
  const custom   = [];
  const texts    = [];

  // Root — value=0, branchvalues:'remainder' means root owns zero area
  labels.push('Coverage');  parents.push('');  values.push(0);  colors.push(null);  custom.push(null);  texts.push('');

  // Sector nodes — value=0 each; with branchvalues:'remainder' they own no area
  // themselves but group all children correctly
  sectors.forEach(sec => {
    labels.push(sec);  parents.push('Coverage');  values.push(0);
    colors.push(null);  custom.push(null);  texts.push('');
  });

  // Ticker leaf nodes
  rows.forEach(d => {
    const sz  = d[curSize] || d.mktcap_b || d.revenue_b || 5;
    const val = d[curMetric];
    labels.push(d.ticker);
    parents.push(d.sector);
    values.push(Math.max(sz, 0.5));
    colors.push(val);
    custom.push(d);
    texts.push(val !== null && val !== undefined ? cfg.fmt(val) : '');
  });

  // Color scale: invert for P/E, D/EBITDA etc
  const colorscale = cfg.invert
    ? [[0,'#10b981'],[0.5,'#eab308'],[1,'#ef4444']]
    : [[0,'#ef4444'],[0.5,'#eab308'],[1,'#10b981']];

  const metricVals = rows.map(d => d[curMetric]).filter(v => v !== null && isFinite(v));
  const cmin = metricVals.length ? Math.min(...metricVals) : 0;
  const cmax = metricVals.length ? Math.max(...metricVals) : 10;

  const bg   = getBg();
  const txtC = getTextColor();
  const lineC = getLineColor();

  const trace = {
    type: 'treemap',
    labels,
    parents,
    values,
    branchvalues: 'remainder',   // sector nodes own zero area; ticker values size the tiles
    marker: {
      colors,
      colorscale,
      cmin,
      cmax: cmax === cmin ? cmin + 1 : cmax,  // prevent zero-range colorscale
      showscale: false,
      line: { width: 1.5, color: lineC },
    },
    text: texts,
    texttemplate: '<b>%{label}</b><br>%{text}',
    hovertemplate: buildHover(cfg),
    customdata: custom,
    textfont: { family: 'JetBrains Mono, monospace', size: 12, color: txtC },
    pathbar: { visible: false },
    tiling: { packing: 'squarify', pad: 2 },
    root: { color: 'transparent' },
  };

  const layout = {
    paper_bgcolor: bg,
    plot_bgcolor:  bg,
    margin: { l: 0, r: 0, t: 0, b: 0 },
    font: { family: 'JetBrains Mono, monospace', color: txtC },
  };

  const config = {
    displayModeBar: false,
    responsive: true,
  };

  Plotly.react('heatmap', [trace], layout, config);

  // Click to open report
  document.getElementById('heatmap').on('plotly_click', function(ev) {
    const pt = ev.points[0];
    if (pt && pt.customdata && pt.customdata.ticker) {
      const t = pt.customdata.ticker;
      window.open(`/reports/${t}_report.html`, '_blank');
    }
  });

  // Update legend labels
  document.getElementById('legendLow').textContent  = cfg.lo;
  document.getElementById('legendHigh').textContent = cfg.hi;
  document.getElementById('legendSize').textContent = curSize === 'mktcap_b' ? 'Market Cap' : 'Revenue';
}

function buildHover(cfg) {
  return [
    '<b>%{label}</b>',
    `<b>${cfg.label}:</b> %{marker.color:.2f}${cfg.unit}`,
    '<extra></extra>',
  ].join('<br>');
}

// ── Button wiring ─────────────────────────────────────────────────────────────
document.querySelectorAll('[data-metric]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-metric]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    curMetric = btn.dataset.metric;
    render();
  });
});

document.querySelectorAll('[data-size]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-size]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    curSize = btn.dataset.size;
    render();
  });
});

// Re-render on theme change so Plotly colors update
const _themeObs = new MutationObserver(() => { if (DATA.length) render(); });
_themeObs.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// ── Boot ──────────────────────────────────────────────────────────────────────
init();
</script>
<script src="/js/app.js"></script>
</body>
</html>
